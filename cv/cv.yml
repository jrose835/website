# -----------------------------------------------------------------------------
# Software — shown as its own section on resume and CV
# -----------------------------------------------------------------------------
software:
  - id: sw-crisp
    name: "CRISP"
    tags: [spatial, method, selected]
    stack: "R · Python"
    url: "https://github.com/santangelo-lab/CRISP"
    text: >-
      Segmentation quality assessment for spatial transcriptomics via
      negative-coexpression purity metrics. Supports Xenium, Seurat, and
      SpatialExperiment objects.
  - id: sw-stringency
    name: "Stringency"
    tags: [ai, reproducibility, selected]
    stack: "Python"
    url: "https://github.com/santangelo-lab/stringency"
    text: >-
      A safety harness for running AI agent data analysis pipelines. Validates
      the analysis plan before any code runs, keeps a tamper-proof provenance
      log, and pauses at key decisions until a person signs off.
  - id: sw-xenium
    name: "Xenium analysis toolkit"
    tags: [spatial, pipeline, selected]
    stack: "Nextflow · R · Python"
    url: "https://github.com/jrose835"
    text: >-
      Three pipelines covering raw Xenium output to annotated cells: alternative
      segmentation (`Xen_Segmentation_NextFlow`), tissue microarray splitting
      (`Xen_TMA_pipeline`), and Seurat-based QC through annotation
      (`Xen_Seurat_Pipeline`).

  - id: sw-cellquant
    name: "CellQuant"
    tags: [spatial, stats]
    stack: "R"
    url: ""
    text: >-
      Cell-composition modelling for spatial transcriptomics. Mixed-effects and
      spatial (SPDE) models with niche-aware adjustment, for deciding whether a
      cell type actually shifted between conditions.
  - id: sw-pymfi
    name: "pyMFI"
    tags: [spatial, imaging]
    stack: "Python"
    url: ""
    text: >-
      Measures immunofluorescence intensity inside spatial-transcriptomics cell
      segmentation boundaries, so protein signal and transcript profile can be
      read off the same cell.

