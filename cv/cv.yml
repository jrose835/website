# -----------------------------------------------------------------------------
# Summary variants. Profiles pick one by key. Add a new key when tailoring.
# -----------------------------------------------------------------------------
summaries:
  general: >-
    Computational biologist working at the intersection of genomics, immunology,
    and mRNA therapeutics. I build methods and pipelines for spatial
    transcriptomics, single-cell genomics, and AI-driven bioinformatics, and I
    run the computational function for a research group, from infrastructure to
    the analysis tooling lab scientists use themselves.

  short: >-
    Computational biologist (PhD). I develop methods and pipelines for spatial
    transcriptomics, single-cell genomics, and AI-assisted analysis.

  academic: >-
    Computational biologist developing methods for image-based spatial
    transcriptomics, with a background in the transcriptional and epigenetic
    regulation of lymphocytes. My current work asks how far we can trust the
    cell boundaries that every downstream spatial result rests on, and how to
    make agent-run analysis reproducible.

  industry: >-
    Computational biologist (PhD) with eleven years across biotech R&D and
    academic research. I analyze large multi-omic and imaging datasets, build
    the reproducible pipelines that produce them, and have taken monoclonal
    antibody products through GMP manufacturing and regulatory filing.

# -----------------------------------------------------------------------------
# Experience
# -----------------------------------------------------------------------------
experience:
  - id: santangelo
    role: "Assistant Scientist"
    org: "Santangelo Lab, Department of Biomedical Engineering"
    org_detail: "Emory University"
    location: "Atlanta, GA"
    start: "2024-09"
    end: ""                     # empty = Present
    tags: [current, computational, spatial, leadership]
    summary: >-
      Sole computational scientist for a ~25-person molecular engineering lab
      developing mRNA and nucleic-acid therapeutics. I own the spatial
      transcriptomics platform end to end, build the lab's analysis software and
      infrastructure, and report to program sponsors including ARPA-H, DARPA,
      and DTRA.
    highlights:
      - id: crisp
        tags: [method, spatial, software, firstauthor]
        text: >-
          Developed **CRISP**, an open-source R and Python package that quantifies
          cell segmentation quality in image-based spatial transcriptomics without
          ground-truth annotation, by detecting cells that co-express mutually
          exclusive marker genes.
      - id: benchmark
        tags: [method, spatial, benchmark]
        text: >-
          Benchmarked six segmentation approaches (10x multimodal segmentation
          kit, Baysor, Proseg, Segger, Cellpose, nuclear expansion) across ten
          mouse organs on a 5,006-gene Xenium panel. How much transcript capture
          you give up for cell purity turns out to depend on the tissue.
      - id: rosc-atlas
        tags: [spatial, scale, delivery]
        text: >-
          Built a multi-tissue spatial atlas of lipid nanoparticle delivery
          comparing injection routes across **2.8 million cells, 11 organs, and
          104 tissue-microarray punches**. The two routes trigger different
          immune responses and remodel splenic myeloid populations
          differently.
      - id: xenium-pipelines
        tags: [pipeline, spatial, nextflow, software]
        text: >-
          Built the lab's Xenium toolchain, from raw 10x output to annotated
          cells: a Nextflow pipeline for alternative segmentation following
          nf-core conventions, Seurat workflows for QC through annotation, and a
          Python tool that splits multi-punch tissue microarrays into per-sample
          datasets.
      - id: cloud
        tags: [infrastructure, cloud, pipeline]
        text: >-
          Moved terabyte-scale segmentation onto 4 TB-memory AWS instances, for
          runs no single workstation can hold. Chunking the work brought a
          332-million-transcript tissue array down to a 72-hour run.
      - id: delivery-mapping
        tags: [spatial, delivery, collaboration, method]
        text: >-
          Map mRNA delivery tropism across tissues and species, including a custom
          method that measures immunofluorescence intensity inside Xenium cell
          boundaries to tie transcript delivery to protein production. This is the
          spatial analysis behind a polymer lung-delivery manuscript under review
          at *Advanced Materials*.
      - id: panel-design
        tags: [spatial, assay]
        text: >-
          Designed the lab's custom Xenium Prime add-on probe panel for mouse
          airway, selecting 44 markers from a 203-candidate review of the
          published airway literature.
      - id: crispra
        tags: [crispr, genomics, translational]
        text: >-
          Lead guide design for a CRISPR-activation therapeutic program. I scored
          and ranked a 552-guide activity screen, then checked the candidates for
          cross-species conservation and against gnomAD and *All of Us*
          population variants.
      - id: stringency
        tags: [ai, software, reproducibility]
        text: >-
          Created **Stringency**, a safety system for AI-driven data analysis:
          it validates the analysis plan against best practice before any code
          runs, keeps a tamper-proof provenance log, and pauses at key decisions
          until a person signs off.
      - id: agent-tooling
        tags: [ai, enablement, leadership]
        text: >-
          Run the lab's AI tooling. I procured and administer the team's
          agent-assistant deployment, and wrote the skills that let bench
          scientists run validated pipelines on their own data and look up lab
          protocols without waiting on me.
      - id: ngs-pipelines
        tags: [pipeline, ngs, nextflow]
        text: >-
          Automated the group's NGS analysis as reproducible Nextflow workflows,
          covering bulk and single-cell RNA-seq, NanoString, and targeted
          amplicon panels for a dozen collaborators.
      - id: infra
        tags: [infrastructure, leadership]
        text: >-
          Administer the lab's compute: two analysis workstations with 134 cores
          and 180+ TB of storage, shared network mounts, and automated backups.
      - id: reporting
        tags: [leadership, communication]
        text: >-
          Own the quarterly technical reporting and present results to program
          sponsors and collaborating labs.
      - id: mentoring
        tags: [mentoring, leadership]
        text: >-
          Mentor junior lab members in R, Python, and reproducible analysis, and
          teach the group to use new computational tools.

  - id: boss
    role: "PhD Graduate Researcher"
    org: "Boss Lab, Genetics & Molecular Biology Program"
    org_detail: "Emory University"
    location: "Atlanta, GA"
    start: "2019-08"
    end: "2024-08"
    tags: [phd, computational, immunology]
    summary: >-
      Thesis work on how transcriptional and epigenetic state encodes immune
      cell identity, and how that regulation breaks in autoimmunity.
    highlights:
      - id: memory-t
        tags: [epigenetics, firstauthor]
        text: >-
          Integrated RNA-seq and ATAC-seq across human memory T cell subsets to
          identify *poised accessible regions*, chromatin whose accessibility
          before and after activation separates the subsets and predicts how they
          respond. Published in *Communications Biology*.
      - id: sle
        tags: [autoimmunity, clinical, firstauthor]
        text: >-
          Showed that lupus disease activity leaves a signature in both the
          transcriptome and the epigenome of otherwise resting naïve B cells, in
          a collaboration with Emory rheumatology. Accepted at the *Journal of
          Clinical Investigation*.
      - id: sle-atlas
        tags: [singlecell, ml, integration]
        text: >-
          Compiled an [SLE single-cell B cell reference
          atlas](https://github.com/jrose835/SLE_Bcell_RefAtlas) from public
          datasets, then queried in-house samples against it and classified
          disease endotypes with machine learning.
      - id: phd-pipelines
        tags: [pipeline, ngs]
        text: >-
          Designed and maintained the lab's bioinformatic pipelines for
          next-generation sequencing: QC, alignment, peak calling, differential
          testing, and gene regulatory network analysis.

